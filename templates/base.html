{% load static %}
<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Portal HRIS | Attendance Pro{% endblock %}</title>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#006477",
                        "secondary-fixed": "#d7e3fb",
                        "tertiary-fixed-dim": "#48d7f9",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e1e2e4",
                        "secondary-fixed-dim": "#bbc7de",
                        "on-primary-fixed-variant": "#0040a2",
                        "on-surface-variant": "#434654",
                        "tertiary-fixed": "#afecff",
                        "on-tertiary-fixed-variant": "#004e5d",
                        "on-error-container": "#93000a",
                        "primary-container": "#0052cc",
                        "on-secondary-fixed": "#101c2d",
                        "on-tertiary-fixed": "#001f27",
                        "inverse-primary": "#b2c5ff",
                        "inverse-on-surface": "#f0f1f3",
                        "outline-variant": "#c3c6d6",
                        "on-secondary-fixed-variant": "#3b475b",
                        "surface-tint": "#0c56d0",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-primary-fixed": "#001848",
                        "inverse-surface": "#2e3132",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#76e2ff",
                        "background": "#f8f9fb",
                        "surface": "#f8f9fb",
                        "on-secondary-container": "#576377",
                        "surface-container-high": "#e7e8ea",
                        "surface-container": "#edeef0",
                        "secondary": "#535f73",
                        "surface-bright": "#f8f9fb",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d9dadc",
                        "surface-variant": "#e1e2e4",
                        "surface-container-low": "#f3f4f6",
                        "primary-fixed": "#dae2ff",
                        "primary": "#003d9b",
                        "secondary-container": "#d4e0f8",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "outline": "#737685",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1e",
                        "tertiary": "#004b59",
                        "on-primary-container": "#c4d2ff",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "lg": "40px",
                        "container-max": "1440px",
                        "xs": "4px",
                        "xl": "64px",
                        "sidebar-width": "260px",
                        "gutter": "24px",
                        "sm": "12px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen">

    <!-- Shared Navigation Components -->
    {% include "components/sidebar.html" %}

    <!-- Main Content Area -->
    <main class="ml-[260px] pt-16 min-h-screen">
        {% include "components/navbar.html" %}

        <!-- Inner Content Container -->
        <div class="p-md lg:p-lg max-w-container-max mx-auto w-full">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Block for Page-Specific Javascript -->
    {% block extra_scripts %}{% endblock %}
</body>
</html>
