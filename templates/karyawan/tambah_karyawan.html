{% load static %}
<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tambah Karyawan | Attendance Pro</title>
<script src="{% static 'js/tailwind.js' %}"></script>

                        "tertiary-fixed": "#afecff",
                        "on-tertiary-fixed-variant": "#004e5d",
                        "on-error-container": "#93000a",
                        "primary-container": "#0052cc",
                        "on-secondary-fixed": "#101c2d",
                        "on-tertiary-fixed": "#001f27",
                        "inverse-primary": "#b2c5ff",
                        "inverse-on-surface": "#f0f1f3",
                        "outline-variant": "#c3c6d6",
                        "on-secondary-fixed-variant": "#3b475b",
                        "surface-tint": "#0c56d0",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-primary-fixed": "#001848",
                        "inverse-surface": "#2e3132",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#76e2ff",
                        "background": "#f8f9fb",

                        "primary-fixed": "#dae2ff",

                        "secondary-container": "#d4e0f8",

                        "on-surface": "#191c1e",
                        "tertiary": "#004b59",
                        "on-primary-container": "#c4d2ff",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]

            },

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-indicator {
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-background text-on-surface">
<!-- SideNavBar (Shared Component) -->
{% include "components/sidebar.html" %}
<!-- TopNavBar (Shared Component) -->
{% include "components/navbar.html" %}
<!-- Main Content Canvas -->
<main class="ml-[260px] pt-24 px-sm md:px-md lg:px-lg pb-xl min-h-screen">
<!-- Header Section -->
<div class="flex justify-between items-end mb-lg">
<div>
<h2 class="text-headline-lg font-headline-lg text-on-surface">Tambah Karyawan Baru</h2>
<p class="text-body-md text-on-surface-variant mt-1">Masukkan data karyawan baru ke dalam sistem.</p>
</div>

</div>

<div class="bg-surface-container-lowest p-md md:p-lg rounded-xl shadow-sm border border-outline-variant max-w-2xl">
    <h3 class="font-headline-md text-headline-md text-on-surface mb-md">Form Tambah Karyawan</h3>
    <form method="POST" action="{% url 'tambah_karyawan' %}" class="space-y-md">
        {% csrf_token %}
        <input type="hidden" name="profile_image_base64" id="profile-image-base64">
        
        <!-- Profile Photo Upload -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-md mb-md p-md bg-surface-container-low rounded-xl border border-outline-variant/30">
            <div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-bold overflow-hidden border-2 border-primary/20 shadow-sm shrink-0" id="photo-preview">
                <span class="material-symbols-outlined text-[32px]">photo_camera</span>
            </div>
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs font-bold">Foto Profil Karyawan</label>
                <input type="file" id="profile-photo-input" accept="image/*" class="text-body-sm text-secondary outline-none file:mr-sm file:py-xs file:px-sm file:rounded-lg file:border-0 file:text-body-sm file:font-semibold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 w-full">
                <p class="text-[10px] text-secondary mt-1">Pilih berkas foto formal untuk profil.</p>
            </div>
        </div>

        <div>
            <label class="block font-label-md text-on-surface-variant mb-xs">Nama Lengkap</label>
            <input type="text" name="fullname" required class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs">Email</label>
                <input type="email" name="email" required class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
            </div>
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs">Password User</label>
                <input type="password" name="password" required class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
            </div>
        </div>
        <div class="grid grid-cols-1 gap-md">
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs">Role / Hak Akses</label>
                <select name="role" required class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
                    <option value="karyawan">Karyawan Biasa</option>
                    <option value="admin">HRD / Admin</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs">Departemen</label>
                <select name="division" id="tambah-division" required onchange="handleTambahDivisionChange()" class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
                    <option value="" disabled selected>-- Pilih Departemen --</option>
                    <option value="HR">HR</option>
                    <option value="CONTROLLER">CONTROLLER</option>
                    <option value="MARKETING COMMUNICATION">MARKETING COMMUNICATION</option>
                    <option value="TRAINER">TRAINER</option>
                    <option value="RND">RND</option>
                    <option value="CREW TOKO">CREW TOKO</option>
                </select>
            </div>
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs">Jabatan</label>
                <input type="text" name="position" id="tambah-position-input" required class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface" placeholder="Staff, Manager">
                <select id="tambah-position-select" class="hidden w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
                    <option value="" disabled selected>-- Pilih Jabatan --</option>
                    <option value="MOD">MOD</option>
                    <option value="LEADER">LEADER</option>
                    <option value="CREW">CREW</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
            <div>
                <label class="block font-label-md text-on-surface-variant mb-xs">Cabang Penempatan</label>
                <select name="branch" class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface">
                    <option value="">-- Tanpa Cabang (Kantor Pusat) --</option>
                    {% for branch in branches %}
                    <option value="{{ branch.id }}">{{ branch.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div></div>
        </div>
        <div class="pt-md flex gap-sm justify-end">
            <a href="{% url 'karyawan' %}" class="px-xl py-sm border border-outline text-secondary rounded-lg font-label-md hover:bg-surface-container transition-all">Batal</a>
            <button type="submit" class="px-xl py-sm bg-primary text-on-primary rounded-lg font-label-md shadow-sm hover:bg-primary-container transition-all">Simpan Karyawan</button>
        </div>
    </form>
</div>

</main>
<script>
        function handleTambahDivisionChange() {
            const divisionSelect = document.getElementById('tambah-division');
            const positionInput = document.getElementById('tambah-position-input');
            const positionSelect = document.getElementById('tambah-position-select');

            if (divisionSelect.value === 'CREW TOKO') {
                positionInput.classList.add('hidden');
                positionInput.removeAttribute('name');
                positionInput.removeAttribute('required');

                positionSelect.classList.remove('hidden');
                positionSelect.setAttribute('name', 'position');
                positionSelect.setAttribute('required', 'required');
                positionSelect.value = '';
            } else {
                positionSelect.classList.add('hidden');
                positionSelect.removeAttribute('name');
                positionSelect.removeAttribute('required');

                positionInput.classList.remove('hidden');
                positionInput.setAttribute('name', 'position');
                positionInput.setAttribute('required', 'required');
            }
        }

        // Handle Profile Image Selection and Conversion to Base64
        const photoInput = document.getElementById('profile-photo-input');
        const photoPreview = document.getElementById('photo-preview');
        const base64Input = document.getElementById('profile-image-base64');
        
        if (photoInput) {
            photoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const base64String = event.target.result;
                        base64Input.value = base64String;
                        photoPreview.innerHTML = `<img src="${base64String}" class="w-full h-full object-cover">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    </script>
</body></html>
